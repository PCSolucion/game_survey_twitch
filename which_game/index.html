<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Votación de Juegos - Overlay OBS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Blur Layer for OBS transparency -->
    <div class="blur-overlay"></div>

    <!-- Background Orbs (subtle decorative) -->
    <div class="bg-layer">
      <div class="bg-orb orb-1"></div>
      <div class="bg-orb orb-2"></div>
    </div>

    <div class="game-hud overlay" id="overlay">
      <div class="hud-body">
        <!-- LEFT: Title Panel (F1 Red) -->
        <section class="hud-panel title-panel">
          <div
            class="panel-list"
            id="menuList"
            style="
              padding: 0 105px 0 20px;
              justify-content: center;
              display: flex;
              box-sizing: border-box;
              width: 100%;
            "
          >
            <div
              class="header"
              style="
                justify-content: center;
                text-align: center;
                margin: 0;
                width: 100%;
              "
            >
              <div
                class="title"
                style="flex-direction: column; align-items: center; width: 100%"
              >
                <span
                  style="
                    font-size: 32px;
                    text-shadow: 2px 3px 6px rgba(0, 0, 0, 0.6);
                    color: #fff;
                    line-height: 1.1;
                    font-weight: 900;
                    white-space: normal;
                    text-align: center;
                    letter-spacing: 2px;
                    font-family: var(--font-display);
                  "
                  >VOTACIÓN DEL<br />PRÓXIMO JUEGO</span
                >
              </div>
            </div>
          </div>
        </section>

        <!-- RIGHT: Grid Panel -->
        <section class="hud-panel">
          <div class="panel-list" id="contentArea">
            <!-- New Hint Header matching Left Panel style -->
            <div class="hint-header">
              <span id="hint">VOTA CON !1-!10<br>EN EL CHAT</span>
            </div>
            
            <div class="grid" id="grid">
              <!-- Game cards (populated by JS) -->
            </div>
          </div>
        </section>
      </div>
      <div class="status" id="status" style="display:none"></div>
    </div>
    <div class="minimized" id="resetBtn" style="display: none; cursor: pointer">
      Reset encuesta
    </div>

    <script src="data.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
